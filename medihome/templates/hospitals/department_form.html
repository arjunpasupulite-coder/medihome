{% extends 'dashboard_base.html' %}

{% block title %}{{ title }} - MediHome{% endblock %}

{% block dashboard_content %}
<div style="max-width: 550px; margin: 2rem auto;">
    <div class="glass-card">
        <h2 style="font-size: 1.5rem; color: var(--dark); margin-bottom: 1.5rem;">{{ title }}</h2>

        <form method="POST" action="." class="needs-validation">
            {% csrf_token %}

            <div class="form-group">
                <label class="form-label">Department Name *</label>
                {{ form.name }}
            </div>

            <div class="form-group">
                <label class="form-label">Department Description</label>
                {{ form.description }}
            </div>

            <div style="display: flex; gap: 1rem; margin-top: 1.5rem;">
                <button type="submit" class="btn btn-primary" style="flex: 1;">Save Department</button>
                <a href="{% url 'hospitals:department_list' %}" class="btn btn-outline">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
