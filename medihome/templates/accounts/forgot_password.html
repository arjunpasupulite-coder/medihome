{% extends 'base.html' %}

{% block title %}Forgot Password - MediHome{% endblock %}

{% block content %}
<div style="min-height: calc(100vh - 200px); display: flex; align-items: center; justify-content: center; padding: 2rem;">
    <div class="glass-card" style="max-width: 420px; width: 100%;">
        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--dark);">Forgot Password</h2>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.9rem;">
            Enter your registered email address to receive password recovery instructions.
        </p>

        <form method="POST" action=".">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Registered Email Address</label>
                <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Send Reset Instructions</button>
        </form>

        <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem;">
            Remembered your password? <a href="{% url 'landing' %}">Return to Home / Login</a>
        </div>
    </div>
</div>
{% endblock %}
